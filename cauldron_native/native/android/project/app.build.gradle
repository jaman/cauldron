plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
{{plugins}}}

android {
    namespace "cauldron.app"
    compileSdk 36

    defaultConfig {
        applicationId "{{id}}"
        minSdk 33
        targetSdk 36
        versionCode {{version_code}}
        versionName "{{version}}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (System.getenv("CAULDRON_ANDROID_KEYSTORE") != null) {
                storeFile file(System.getenv("CAULDRON_ANDROID_KEYSTORE"))
                storePassword System.getenv("CAULDRON_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("CAULDRON_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("CAULDRON_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress "zip", "stamp"
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.01.01")
    implementation "androidx.activity:activity-compose:1.12.2"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3-adaptive-navigation-suite"
    implementation "androidx.compose.material3.adaptive:adaptive-layout:1.2.0"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation:1.2.0"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-session:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation "androidx.camera:camera-camera2:1.5.1"
    implementation "androidx.camera:camera-lifecycle:1.5.1"
    implementation "androidx.camera:camera-view:1.5.1"
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "androidx.window:window:1.5.0"
    implementation "com.patrykandpatrick.vico:compose-m3:3.1.0"
{{dependencies}}}
