<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-label="The Cauldron packages by layer: front ends on top, drawing below them, the core beneath, and the components at the side">
  <title>The packages by layer</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a90"/>
    </marker>
    <style>
      .box{fill:#f7f7f9;stroke:#c9c9cf;stroke-width:1.5;rx:8}
      .accent{fill:#fdf3ec;stroke:#c98a5f}
      .core{fill:#eef3f8;stroke:#8aa6bd}
      .comp{fill:#fff;stroke:#c9c9cf;stroke-dasharray:5 4}
      .t{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:#1d1d1f}
      .m{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:12px;fill:#5c5c63}
      .h{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:12px;letter-spacing:.08em;fill:#8a8a90;text-transform:uppercase}
      .e{stroke:#8a8a90;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <text class="h" x="20" y="26">Front ends</text>
  <rect class="box" x="20" y="36" width="190" height="64"/>
  <text class="t" x="115" y="64" text-anchor="middle">terminal</text>
  <text class="m" x="115" y="84" text-anchor="middle">cauldron_2d_drafter</text>

  <rect class="box" x="222" y="36" width="190" height="64"/>
  <text class="t" x="317" y="64" text-anchor="middle">browser</text>
  <text class="m" x="317" y="84" text-anchor="middle">cauldron_2d_net</text>

  <rect class="box" x="424" y="36" width="190" height="64"/>
  <text class="t" x="519" y="64" text-anchor="middle">window</text>
  <text class="m" x="519" y="84" text-anchor="middle">cauldron_2d_wx</text>

  <rect class="box" x="626" y="36" width="190" height="64"/>
  <text class="t" x="721" y="64" text-anchor="middle">phone</text>
  <text class="m" x="721" y="84" text-anchor="middle">cauldron_2d_native</text>

  <text class="h" x="20" y="146">Drawing</text>
  <rect class="box accent" x="20" y="156" width="392" height="76"/>
  <text class="t" x="216" y="184" text-anchor="middle">cauldron_2d</text>
  <text class="m" x="216" y="206" text-anchor="middle">tiles, atlases, pictures, projections, maps, physics</text>

  <rect class="box accent" x="424" y="156" width="392" height="76"/>
  <text class="t" x="620" y="182" text-anchor="middle">cauldron_3d · 3d_scene · 3d_formats · gpu</text>
  <text class="m" x="620" y="204" text-anchor="middle">software 3D, scenes, file formats, the card</text>
  <text class="m" x="620" y="220" text-anchor="middle">3d_net and 3d_kino serve a scene to a browser or a cell</text>

  <text class="h" x="20" y="266">The engine</text>
  <rect class="box core" x="20" y="276" width="796" height="76"/>
  <text class="t" x="418" y="304" text-anchor="middle">cauldron_core</text>
  <text class="m" x="418" y="326" text-anchor="middle">worlds, players, input, menus, client contract, sound, saving, scores, net</text>

  <text class="h" x="20" y="388">Components — MIT</text>
  <rect class="box comp" x="20" y="398" width="150" height="30"/>
  <text class="m" x="95" y="418" text-anchor="middle">drafter</text>
  <rect class="box comp" x="182" y="398" width="150" height="30"/>
  <text class="m" x="257" y="418" text-anchor="middle">linocut</text>
  <rect class="box comp" x="344" y="398" width="150" height="30"/>
  <text class="m" x="419" y="418" text-anchor="middle">french_curve</text>
  <rect class="box comp" x="506" y="398" width="150" height="30"/>
  <text class="m" x="581" y="418" text-anchor="middle">tuning_fork</text>
  <rect class="box comp" x="668" y="398" width="148" height="30"/>
  <text class="m" x="742" y="418" text-anchor="middle">gamepad</text>

  <path class="e" d="M115 100v50"/>
  <path class="e" d="M317 100v50"/>
  <path class="e" d="M519 100v50"/>
  <path class="e" d="M721 100v50"/>
  <path class="e" d="M216 232v38"/>
  <path class="e" d="M620 232v38"/>
  <path class="e" d="M95 398v-40" marker-end="none" stroke-dasharray="5 4"/>
  <path class="e" d="M257 398v-40" marker-end="none" stroke-dasharray="5 4"/>
  <path class="e" d="M419 398v-40" marker-end="none" stroke-dasharray="5 4"/>
  <path class="e" d="M581 398v-40" marker-end="none" stroke-dasharray="5 4"/>
  <path class="e" d="M742 398v-40" marker-end="none" stroke-dasharray="5 4"/>
</svg>
