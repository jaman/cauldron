<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="How a frame is made: input reaches the world, the world ticks and asks the game for a view, the view becomes a scene and a hud, the view behaviour supplies drawing props, and the front end draws">
  <title>How a frame is made</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a90"/>
    </marker>
    <style>
      .s{fill:#f7f7f9;stroke:#c9c9cf;stroke-width:1.5;rx:8}
      .hot{fill:#fdf3ec;stroke:#c98a5f}
      .t{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#1d1d1f}
      .m{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:11.5px;fill:#5c5c63}
      .h{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.07em;fill:#8a8a90}
      .e{stroke:#8a8a90;stroke-width:1.6;fill:none;marker-end:url(#b)}
      .d{stroke:#8a8a90;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#b)}
    </style>
  </defs>

  <rect class="s" x="18" y="58" width="140" height="92"/>
  <text class="t" x="88" y="88" text-anchor="middle">input</text>
  <text class="m" x="88" y="110" text-anchor="middle">keys, pad, pointer</text>
  <text class="m" x="88" y="128" text-anchor="middle">Cauldron.Input</text>

  <rect class="s" x="178" y="58" width="140" height="92"/>
  <text class="t" x="248" y="88" text-anchor="middle">the world</text>
  <text class="m" x="248" y="110" text-anchor="middle">tick, or on input</text>
  <text class="m" x="248" y="128" text-anchor="middle">Cauldron.World</text>

  <rect class="s" x="338" y="58" width="140" height="92"/>
  <text class="t" x="408" y="84" text-anchor="middle">the game</text>
  <text class="m" x="408" y="106" text-anchor="middle">step/2</text>
  <text class="m" x="408" y="124" text-anchor="middle">view/2 per player</text>
  <text class="m" x="408" y="142" text-anchor="middle">Cauldron.Game</text>

  <rect class="s hot" x="498" y="58" width="150" height="92"/>
  <text class="t" x="573" y="84" text-anchor="middle">scene + hud</text>
  <text class="m" x="573" y="106" text-anchor="middle">plain maps and rows</text>
  <text class="m" x="573" y="124" text-anchor="middle">Cauldron.Client.Game</text>
  <text class="m" x="573" y="142" text-anchor="middle">scene/2, hud/1</text>

  <rect class="s" x="668" y="58" width="154" height="92"/>
  <text class="t" x="745" y="84" text-anchor="middle">the front end</text>
  <text class="m" x="745" y="106" text-anchor="middle">glyphs, pixels, canvas</text>
  <text class="m" x="745" y="124" text-anchor="middle">or the card</text>

  <path class="e" d="M158 104h14"/>
  <path class="e" d="M318 104h14"/>
  <path class="e" d="M478 104h14"/>
  <path class="e" d="M648 104h14"/>

  <rect class="s" x="498" y="196" width="150" height="72"/>
  <text class="t" x="573" y="222" text-anchor="middle">view behaviour</text>
  <text class="m" x="573" y="242" text-anchor="middle">look, zoom, props</text>
  <text class="m" x="573" y="258" text-anchor="middle">Cauldron.Client.View</text>

  <path class="e" d="M573 196v-38"/>
  <text class="m" x="585" y="180">how it is drawn</text>

  <rect class="s" x="18" y="196" width="300" height="72"/>
  <text class="t" x="168" y="222" text-anchor="middle">over the network</text>
  <text class="m" x="168" y="242" text-anchor="middle">session asks a drawer for pushes</text>
  <text class="m" x="168" y="258" text-anchor="middle">Cauldron.Net.Session · Cauldron.Net.Drawer</text>


  <text class="h" x="18" y="36">ONE TICK, ONE PLAYER</text>
</svg>
